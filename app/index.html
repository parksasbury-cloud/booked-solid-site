<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booked Solid: shop dashboard</title><meta name="robots" content="noindex">
<style>
:root{--c:#e4572e;--ink:#1b1b1f;--m:#666}*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:#f6f6f7;color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 8px}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 6px #0001}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font:inherit}
button{background:var(--c);color:#fff;border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
button.alt{background:#fff;color:var(--ink);border:1px solid #ccc}
.err{color:#b00020;min-height:1.2em}.muted{color:var(--m);font-size:14px}
.plans{display:grid;gap:10px}.plan{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #ddd;border-radius:10px;padding:12px}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:8px 0}.row:last-child{border:0}
.top{display:flex;justify-content:space-between;align-items:center}
[hidden]{display:none!important}
</style></head><body><main>
<div class="top"><div><b style="color:var(--c)">Booked Solid</b></div><button class="alt" id="out" hidden>Log out</button></div>
<div id="auth" class="card" hidden>
<h1 id="atitle">Log in to your shop</h1><p class="muted">Each shop sees only its own bookings and settings.</p>
<input id="shop" placeholder="Shop name" autocomplete="organization" hidden>
<input id="email" type="email" placeholder="Email" autocomplete="email">
<input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
<div class="err" id="err"></div>
<button id="go">Log in</button> <button class="alt" id="sw">Create an account</button>
<p class="muted"><a href="#" id="fg">Forgot your password?</a></p>
<p class="muted">Test mode: payments here are Stripe test payments (card 4242 4242 4242 4242).</p>
</div>
<div id="dash" hidden>
<div class="card"><h1 id="name"></h1><div class="muted" id="sub"></div></div>
<div id="msg" class="card" hidden></div>
<div class="card"><h2>Your plan</h2><div class="plans" id="plans"></div></div>
<div class="card"><h2>Take deposits</h2><p class="muted" id="cst">Connect Stripe so client deposits go straight to you.</p><button id="conn">Connect Stripe</button></div>
<div class="card"><h2>Your bookings</h2><div id="bk" class="muted">Loading...</div></div>
</div></main>
<script>
const API='https://booked-api-w3kvqqmraq-uc.a.run.app',$=s=>document.querySelector(s);let mode='login';
const tok=()=>localStorage.getItem('bsTok'),H=()=>({'Content-Type':'application/json',Authorization:'Bearer '+tok()});
async function post(p,b,auth){const r=await fetch(API+p,{method:'POST',headers:auth?H():{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
function setMode(m){mode=m;$('#fg').hidden=m==='signup'||m==='reset';$('#email').hidden=m==='reset';$('#pw').hidden=m==='forgot';$('#sw').hidden=m==='reset'||m==='forgot';$('#shop').hidden=m!=='signup';$('#atitle').textContent={signup:'Create your shop account',forgot:'Reset your password',reset:'Choose a new password'}[m]||'Log in to your shop';$('#go').textContent={signup:'Create account',forgot:'Email me a reset link',reset:'Save new password'}[m]||'Log in';$('#sw').textContent=m==='signup'?'I have an account':'Create an account';$('#pw').autocomplete=m==='signup'?'new-password':'current-password'}
const RQ=new URLSearchParams(location.search);
$('#fg').onclick=ev=>{ev.preventDefault();setMode('forgot')};
$('#sw').onclick=()=>setMode(mode==='login'?'signup':'login');
$('#go').onclick=async()=>{$('#err').textContent='';try{
 if(mode==='forgot'){await post('/api/auth/forgot',{email:$('#email').value});$('#err').style.color='#2a7';$('#err').textContent='If that email has an account, a reset link is on its way (check spam).';return}
 if(mode==='reset'){const j=await post('/api/auth/reset',{email:RQ.get('email'),token:RQ.get('reset'),password:$('#pw').value});localStorage.setItem('bsTok',j.token);history.replaceState(null,'','/app/');RQ.delete('reset');setMode('login');load();return}
 const j=await post('/api/auth/'+mode,{email:$('#email').value,password:$('#pw').value,shopName:$('#shop').value});localStorage.setItem('bsTok',j.token);load()}catch(e){$('#err').textContent=e.message}};
$('#out').onclick=()=>{localStorage.removeItem('bsTok');location.href='/app/'};
const PL=[['bundle','Booking + AI Receptionist',119],['booking','Booking',49],['receptionist','AI Receptionist',99]];
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  if(!tok()){$('#auth').hidden=false;$('#dash').hidden=true;$('#out').hidden=true;return}
  const r=await fetch(API+'/api/me',{headers:H()});if(!r.ok){localStorage.removeItem('bsTok');return load()}
  const m=await r.json();$('#auth').hidden=true;$('#dash').hidden=false;$('#out').hidden=false;
  $('#name').textContent=m.name;$('#sub').textContent=m.email+(m.plan?' · plan: '+m.plan:'');
  $('#plans').innerHTML=PL.map(p=>`<div class="plan"><div><b>${p[1]}</b><div class="muted">$${p[2]}/month</div></div><button data-p="${p[0]}">Subscribe</button></div>`).join('');
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{location.href=(await post('/api/billing/checkout',{plan:b.dataset.p},1)).url}catch(x){alert(x.message);b.disabled=false}});
  $('#cst').textContent=m.stripeConnected?'Stripe account created. Finish or review onboarding any time.':'Connect Stripe so client deposits go straight to you.';
  $('#conn').onclick=async()=>{try{location.href=(await post('/api/me/connect',{},1)).url}catch(x){alert(x.message)}};
  $('#bk').innerHTML=m.bookings.length?m.bookings.map(b=>`<div class="row"><div><b>${e(b.name)}</b><div class="muted">${e(b.service)}${b.staff?' · '+e(b.staff):''}</div></div><div>${e(String(b.start).replace('T',' '))}</div></div>`).join(''):'No bookings yet. Your booking page will show here once clients book.';
  const q=new URLSearchParams(location.search);if(q.get('subscribed')){$('#msg').hidden=false;$('#msg').textContent='Thanks! Subscription started (test mode): '+q.get('subscribed')+'.'}
}
setMode(RQ.get('reset')?'reset':'login');if(RQ.get('reset')){localStorage.removeItem('bsTok');$('#auth').hidden=false}else load();
</script></body></html>
